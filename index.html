<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juego Embebido</title>
  <style>
    body {
      margin: 0;
      background: #000; /* fondo negro para que se vea mejor */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    iframe {
      border: none;
      width: 100%;
      max-width: 960px; /* ancho máximo */
      height: 540px;    /* ajusta la altura según tu juego */
      border-radius: 12px; /* esquinas redondeadas opcionales */
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <iframe 
    src="https://play.unity.com/api/v1/games/game/0a31277c-9921-49a4-a5c4-b28ae608769d/build/latest/frame" 
    allow="autoplay; xr-spatial-tracking" 
    allowfullscreen 
    title="Juego Unity">
  </iframe>
</body>
</html>
