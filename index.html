<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mutibo WebGL</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: #111;
      color: #fff;
      height: 100vh;
    }

    header {
      width: 100%;
      background: #222;
      padding: 1rem;
      text-align: center;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
    }

    .actions {
      margin: 1rem;
    }

    button {
      background: #ff6600;
      border: none;
      color: white;
      padding: 0.7rem 1.2rem;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #e65c00;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mutibo</h1>
    <p>Juego WebGL publicado en Netlify</p>
  </header>

  <!-- El juego embebido -->
  <iframe src="https://mutibo.netlify.app" allowfullscreen></iframe>

  <div class="actions">
    <button onclick="window.open('https://mutibo.netlify.app', '_blank')">
      Abrir en nueva pestaña
    </button>
  </div>
</body>
</html>
